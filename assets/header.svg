<svg width="900" height="235" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16162a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="235" rx="8" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="233" rx="8" fill="none" stroke="#3b3b5c" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="898" height="32" rx="8" fill="#2d2d44"/>
  <rect x="1" y="22" width="898" height="11" fill="#2d2d44"/>
  <line x1="1" y1="33" x2="899" y2="33" stroke="#3b3b5c" stroke-width="1"/>

  <!-- Title bar text -->
  <text x="450" y="22" text-anchor="middle" fill="#c9d1d9" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13">kali@kali: ~</text>

  <!-- Window buttons (right side, XFCE style) -->
  <circle cx="848" cy="17" r="7" fill="#3b3b5c"/>
  <circle cx="868" cy="17" r="7" fill="#3b3b5c"/>
  <circle cx="888" cy="17" r="7" fill="#1793d1"/>

  <!-- Prompt 1, line 1 -->
  <text x="16" y="62" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
    <tspan fill="#00d4aa">┌──(</tspan><tspan fill="#00d4aa" font-weight="bold">sahil㉿kali</tspan><tspan fill="#00d4aa">)-[</tspan><tspan fill="#e6edf3" font-weight="bold">~</tspan><tspan fill="#00d4aa">]</tspan>
  </text>

  <!-- Prompt 1, line 2 -->
  <text x="16" y="80" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
    <tspan fill="#00d4aa">└─</tspan><tspan fill="#e6edf3">$ </tspan><tspan fill="#c9d1d9">whoami</tspan>
  </text>

  <!-- Output: name -->
  <text x="16" y="106" fill="#e6edf3" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="22" font-weight="bold">Sahil Panchal</text>

  <!-- Output: role -->
  <text x="16" y="124" fill="#8b949e" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13">4th Year Cybersecurity Student @ York University · Toronto, Canada</text>

  <!-- Prompt 2, line 1 -->
  <text x="16" y="150" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
    <tspan fill="#00d4aa">┌──(</tspan><tspan fill="#00d4aa" font-weight="bold">sahil㉿kali</tspan><tspan fill="#00d4aa">)-[</tspan><tspan fill="#e6edf3" font-weight="bold">~</tspan><tspan fill="#00d4aa">]</tspan>
  </text>

  <!-- Prompt 2, line 2 -->
  <text x="16" y="168" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
    <tspan fill="#00d4aa">└─</tspan><tspan fill="#e6edf3">$ </tspan><tspan fill="#c9d1d9">echo $FOCUS</tspan>
  </text>

  <!-- Output: focus -->
  <text x="16" y="190" fill="#8b949e" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="14">Cybersecurity · Cloud Security · Security Engineering</text>

  <!-- Quote as terminal comment -->
  <text x="16" y="220" fill="#6e7681" font-family="'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-style="italic"># "Any exploit is a total exploit. The tiniest crack becomes a flood." — Harold Finch</text>
</svg>
